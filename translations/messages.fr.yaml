projects:
  sparklequiz:
    title: "SparkleQuiz"
    year: "Depuis 2025"
    tagline: "Application de quiz solo et multijoueur, jouable sur le web et publiée sur l'App Store et Google Play."
    context: "SparkleQuiz est mon entreprise : je la conçois, la développe et l'exploite seul depuis 2025. On y joue en solo, avec un système de progression, ou à plusieurs dans des salons synchronisés en temps réel. Les joueurs créent leurs propres quiz, ajoutent des amis et suivent leurs statistiques. L'application est gratuite, jouable dans le navigateur et disponible sur les deux stores mobiles."
    role: "Fondateur et seul développeur : conception, back-end, front-end, applications mobiles, infrastructure et publication."
    highlight_1: "Back-end Symfony et MySQL, front-end Vue 3 et Tailwind, avec synchronisation en temps réel des parties multijoueur grâce au protocole Mercure."
    highlight_2: "Applications iOS et Android construites avec Capacitor à partir de la même base de code, et publiées sur l'App Store et Google Play."
    highlight_3: "Système de progression complet : niveaux, expérience, quêtes quotidiennes, 68 trophées et 4 classements synchronisés avec Game Center."
    highlight_4: "Huit pipelines d'intégration et de déploiement continus sur GitHub Actions, dont le déploiement Docker en production et la mise à jour des fiches des stores."
    highlight_5: "Tests de bout en bout avec Playwright sur le web et Maestro sur mobile, analyse statique avec PHPStan, audits de performance avec Lighthouse."
    highlight_6: "Plus de 4 000 commits : le produit est en production et continue d'évoluer chaque semaine."
  charlotte:
    title: "Charlotte Bastos"
    tagline: "Site vitrine et boutique d'une illustratrice freelance, entièrement modifiable depuis un CMS."
    context: "Charlotte Bastos est illustratrice, motion designer et graphiste freelance. Je lui ai développé un site complet : galeries d'illustrations, d'animations et de graphisme, grille tarifaire interactive, formulaire de commande, boutique en ligne et pages légales, en quatre langues. Tout le contenu se modifie depuis un espace d'administration, sans toucher au code."
    role: "Conception et développement de bout en bout, seul : front-end, back-end, CMS, paiement et déploiement."
    highlight_1: "Front-end Nuxt 3 et Tailwind, avec des pages de galerie pré-rendues, du rendu serveur pour le reste, des animations GSAP et des apparitions au défilement."
    highlight_2: "CMS headless Sanity : 16 schémas sur mesure (illustrations, univers, vidéos, produits, tarifs, témoignages, pages légales) aux champs traduits, pour que Charlotte publie sans développeur."
    highlight_3: "Boutique avec panier et paiement Stripe Checkout. Un webhook confirme chaque commande et prévient Charlotte par e-mail via Resend."
    highlight_4: "Grille tarifaire interactive qui calcule le prix selon le cadrage, le niveau de rendu et les suppléments, et formulaire de commande qui s'ouvre ou se ferme depuis les réglages du site."
    highlight_5: "Site en français, anglais, espagnol et allemand avec Nuxt i18n, appuyé sur 20 routes d'API côté serveur."
    screen_home: "Page d'accueil"
    screen_gallery: "Galerie d'illustrations"
    screen_pricing: "Grille tarifaire interactive"
    screen_commissions: "Formulaire de commande"
  aloas:
    title: "ALOAS"
    tagline: "Plateforme de gestion de tournois sportifs pour une association, en production."
    context: "ALOAS aide une association à organiser des tournois pour des personnes en situation de handicap : inscriptions, planification, chronomètre, scores et suivi des résultats. Le site est en ligne et sert à de vrais événements."
    role: "Chef de projet et développeur fullstack, responsable de la mise en production."
    highlight_1: "Développement du front-end et du back-end avec Symfony, Twig et Tailwind."
    highlight_2: "Pilotage du projet et coordination de l'équipe jusqu'à la livraison."
    highlight_3: "Mise en production : hébergement chez OVH, conteneur Docker sur Render, déploiement automatisé avec GitLab CI/CD."
  iot:
    title: "Chaîne IoT"
    tagline: "Architecture IoT de bout en bout : capteurs, radio chiffrée, serveur et application Android."
    context: "Projet du module Développement embarqué et IoT de CPE Lyon, en équipe de quatre. Un micro:bit relève température, humidité, pression et luminosité dans un bureau, et les envoie par radio à une passerelle qui les relaie à un serveur Python. Une application Android affiche les mesures et règle à distance l'ordre d'affichage d'un écran OLED."
    role: "Application Android, protocole de communication avec le serveur et sécurité des échanges."
    highlight_1: "Développement de l'application Android en Java avec Material 3 : réception des mesures et envoi des commandes d'affichage."
    highlight_2: "Définition du protocole entre l'application et le serveur, échangé en UDP sur le réseau Wi-Fi."
    highlight_3: "Prise en charge de la sécurité des échanges, dont le chiffrement AES-128 de la liaison radio entre l'objet et la passerelle."
  interactive_book:
    title: "Livre interactif"
    tagline: "Création et partage de livres interactifs, avec génération d'histoires par IA."
    context: "Livre interactif permet de créer des récits, d'y ajouter textes, images et liens, puis de les partager. Une fonction de génération s'appuie sur l'API OpenAI pour écrire une histoire à partir de quelques mots."
    role: "Développeur back-end, en binôme."
    highlight_1: "Back-end Symfony : modélisation des livres, de leurs pages et de leurs liens."
    highlight_2: "Intégration de l'API OpenAI pour générer des histoires à partir d'une consigne courte."
    highlight_3: "Conteneurisation de l'application avec Docker."
  chess:
    title: "ChessJS"
    tagline: "Jeu d'échecs complet en TypeScript, avec validation des coups."
    context: "ChessJS est un jeu d'échecs jouable à deux, qui valide chaque coup et conserve l'historique de la partie."
    role: "Développeur back-end, en binôme : moteur de jeu et validation des coups."
    highlight_1: "Conception du moteur de jeu : représentation de l'échiquier et génération des coups légaux."
    highlight_2: "Implémentation de l'ensemble des règles et de l'historique de la partie."
  spotify:
    title: "SpotifySong"
    tagline: "Recherche et écoute de morceaux via l'API Spotify, avec bibliothèque et playlists."
    context: "SpotifySong permet de rechercher des morceaux par titre, artiste ou album, de les écouter et de les ranger en playlists, à partir des données de l'API Spotify."
    role: "Projet réalisé seul, de bout en bout."
    highlight_1: "Intégration de l'API Spotify pour la recherche de morceaux et la récupération de leurs métadonnées."
    highlight_2: "Persistance des bibliothèques et des playlists des utilisateurs en MySQL."
  phase10:
    title: "Phase 10"
    year: "2023 à 2024"
    tagline: "Jeu de cartes Phase 10 jouable à plusieurs en temps réel."
    context: "Adaptation web du jeu de cartes Phase 10 : dix phases à compléter dans l'ordre, jouables à plusieurs en temps réel."
    role: "Développeur front-end, dans une équipe de quatre."
    highlight_1: "Développement de l'interface de jeu en Angular."
    highlight_2: "Synchronisation des parties en temps réel avec Socket.IO côté client."


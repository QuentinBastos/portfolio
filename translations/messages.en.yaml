chess:
  title: "ChessJS"
  description: "A chess game made with Typescript / NodeJS."
  long_description: "ChessJS is a fully-featured chess game built using Typescript and NodeJS. It offers a seamless and interactive experience for both beginners and advanced players. The game includes features such as move validation and game history. The clean and intuitive interface ensures an enjoyable user experience, while the robust backend guarantees smooth and efficient gameplay. If you want to challenge a friend, ChessJS provides a comprehensive platform for all your chess needs."

phase10:
  title: "Phase 10"
  description: "A phase 10 game made with Angular."
  long_description: "Phase 10 is a card game that is played with a standard deck of cards. The game consists of ten phases, each with a unique set of requirements. Players must complete each phase before moving on to the next. The game is won by the first player to complete all ten phases. Phase 10 is a fun and challenging game that requires strategy, skill, and a bit of luck. The game is easy to learn but difficult to master, making it a great choice for players of all skill levels. The website use socket.io , so you can play with your friends in real time."

interactive_book:
  title: "Interactive book"
  description: "A website build to create your own interactive book and share it with others."
  long_description: "Interactive Book is a website that allows users to create and share their own interactive books. Users can add text, images, and links to create a unique and engaging reading experience. The website features a user-friendly interface that makes it easy to create and edit books. Users can also share their books with others, allowing them to read and interact with the content. Interactive Book is a fun and creative way to share stories, ideas, and information with others. You can also use generative AI to create your own story by giving it a few words."

spotify:
  title: "SpotifySong"
  description: "A website that use Spotify API to get information about a song. You can save, listen, share and more."
  long_description: "SpotifySong is a website that allows users to search for and listen to songs using the Spotify API. Users can search for songs by title, artist, or album, and listen to them directly on the website. The website also provides information about the song, such as the artist, album, and release date. Users can save songs to their library, create playlists, and share songs with others. SpotifySong is a convenient and user-friendly way to discover new music and enjoy your favorite songs."

aloas:
  title: "Aloas"
  description: "A (hosted) website created to help tournament organizers manage tournaments for disabled people."
  long_description: "Aloas is a website designed to help tournament organizers manage tournaments for disabled people. The website provides tools for creating and managing tournaments, including registration, scheduling, timer and scoring. Organizers can create custom tournament formats, set up teams, and track results. The website also includes features for communicating with participants, sharing updates, and promoting events. Aloas is a user-friendly and accessible platform that makes it easy to organize and run tournaments for disabled people."


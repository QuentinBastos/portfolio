projects:
  sparklequiz:
    title: "SparkleQuiz"
    year: "Since 2025"
    tagline: "A solo and multiplayer quiz app, playable on the web and published on the App Store and Google Play."
    context: "SparkleQuiz is my own business: I have been designing, building and running it on my own since 2025. You can play solo, with a progression system, or with others in rooms synchronised in real time. Players create their own quizzes, add friends and track their statistics. The app is free, playable in the browser and available on both mobile stores."
    role: "Founder and sole developer: design, back end, front end, mobile apps, infrastructure and store releases."
    highlight_1: "Symfony and MySQL back end, Vue 3 and Tailwind front end, with real-time synchronisation of multiplayer games over the Mercure protocol."
    highlight_2: "iOS and Android apps built with Capacitor from the same codebase, and published on the App Store and Google Play."
    highlight_3: "A full progression system: levels, experience, daily quests, 68 achievements and 4 leaderboards synced with Game Center."
    highlight_4: "Eight continuous integration and delivery pipelines on GitHub Actions, including the Docker production deployment and store listing updates."
    highlight_5: "End-to-end tests with Playwright on the web and Maestro on mobile, static analysis with PHPStan, performance audits with Lighthouse."
    highlight_6: "Over 4,000 commits: the product is live and keeps evolving every week."
  charlotte:
    title: "Charlotte Bastos"
    tagline: "Portfolio and online shop for a freelance illustrator, fully editable through a CMS."
    context: "Charlotte Bastos is a freelance illustrator, motion designer and graphic designer. I built a complete website for Charlotte: illustration, animation and graphic design galleries, an interactive pricing grid, a commission form, an online shop and legal pages, in four languages. All the content is edited from an admin studio, without touching the code."
    role: "Designed and built end to end on my own: front end, back end, CMS, payments and deployment."
    highlight_1: "Nuxt 3 and Tailwind front end, with prerendered gallery pages, server-side rendering for the rest, GSAP animations and scroll reveals."
    highlight_2: "Sanity headless CMS: 16 custom schemas (illustrations, universes, videos, products, pricing, testimonials, legal pages) with translated fields, so Charlotte can publish without a developer."
    highlight_3: "Shop with a cart and Stripe Checkout payments. A webhook confirms each order and notifies Charlotte by email through Resend."
    highlight_4: "Interactive pricing grid that computes the price from framing, rendering level and extras, and a commission form that opens or closes from the site settings."
    highlight_5: "Site in French, English, Spanish and German with Nuxt i18n, backed by 20 server API routes."
    screen_home: "Home page"
    screen_gallery: "Illustration gallery"
    screen_pricing: "Interactive pricing grid"
    screen_commissions: "Commission form"
  aloas:
    title: "ALOAS"
    tagline: "A sports tournament management platform for a non-profit, in production."
    context: "ALOAS helps a non-profit organise tournaments for people with disabilities: registration, scheduling, timer, scoring and results tracking. The site is live and used for real events."
    role: "Project lead and full-stack developer, in charge of the production release."
    highlight_1: "Front-end and back-end development with Symfony, Twig and Tailwind."
    highlight_2: "Led the project and coordinated the team through to delivery."
    highlight_3: "Production release: OVH hosting, Docker container on Render, automated deployment with GitLab CI/CD."
  iot:
    title: "IoT pipeline"
    tagline: "An end-to-end IoT architecture: sensors, encrypted radio, server and Android app."
    context: "Project for the Embedded Development and IoT module at CPE Lyon, in a team of four. A micro:bit reads temperature, humidity, pressure and light in an office and sends them over radio to a gateway, which relays them to a Python server. An Android app displays the readings and remotely sets the display order of an OLED screen."
    role: "Android app, communication protocol with the server and security of the exchanges."
    highlight_1: "Built the Android app in Java with Material 3: receiving readings and sending display commands."
    highlight_2: "Designed the protocol between the app and the server, exchanged over UDP on the Wi-Fi network."
    highlight_3: "Handled the security of the exchanges, including AES-128 encryption of the radio link between the device and the gateway."
  interactive_book:
    title: "Interactive book"
    tagline: "Create and share interactive books, with AI story generation."
    context: "Interactive book lets users write stories, add text, images and links, then share them. A generation feature relies on the OpenAI API to write a story from a few words."
    role: "Back-end developer, in a pair."
    highlight_1: "Symfony back end: data model for books, their pages and their links."
    highlight_2: "Integrated the OpenAI API to generate stories from a short prompt."
    highlight_3: "Containerised the application with Docker."
  chess:
    title: "ChessJS"
    tagline: "A complete chess game in TypeScript, with move validation."
    context: "ChessJS is a two-player chess game that validates every move and keeps the game history."
    role: "Back-end developer, in a pair: game engine and move validation."
    highlight_1: "Designed the game engine: board representation and legal move generation."
    highlight_2: "Implemented the full set of rules and the game history."
  spotify:
    title: "SpotifySong"
    tagline: "Search and play tracks through the Spotify API, with a library and playlists."
    context: "SpotifySong lets you search for tracks by title, artist or album, play them and organise them into playlists, using data from the Spotify API."
    role: "Built on my own, end to end."
    highlight_1: "Integrated the Spotify API for track search and metadata retrieval."
    highlight_2: "Stored user libraries and playlists in MySQL."
  phase10:
    title: "Phase 10"
    year: "2023 to 2024"
    tagline: "The Phase 10 card game, playable with others in real time."
    context: "A web version of the Phase 10 card game: ten phases to complete in order, playable with others in real time."
    role: "Front-end developer, in a team of four."
    highlight_1: "Built the game interface in Angular."
    highlight_2: "Real-time game synchronisation with Socket.IO on the client side."

